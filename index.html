<!DOCTYPE html>
<html>
    
<head>
    <title>Python + HTML</title>
</head>

<body>
    <h1>Welcome to Lost and Found App</h1>

    <h2>Login</h2>

    <form id="loginForm">
        <input type="text" id="username" placeholder="Username" required>
        <br><br>
        <input type="password" id="password" placeholder="Password" required>
        <br><br>
        <button type="submit">Login</button>
    </form>

    <p>haven't registered yet?</p>

    <a href="register/student/">
        <button>Register as a Student</button>
    </a><br><br>
    
    <a href="register/lecturer/">
        <button>Register as a Lecturer</button>
    </a><br><br>

    <a href="register/community/">
        <button>Register as a Community Member</button>
    </a>

</body>
</html>

<script>
    document.getElementById("loginForm").addEventListener("submit", function(event) {
        event.preventDefault();
        
        const loginData = {
            username: document.getElementById("username").value,
            password: document.getElementById("password").value
        };

        fetch("https://bruhif.github.io/login", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(loginData)
        })
        .then(response => response.json())
        .then(data => {
            if (data.success) {
                alert(data.message);
                // Redirect to the appropriate dashboard based on user type
                if (data.usertype === "student") {
                    window.location.href = "https://bruhif.github.io/dashboard/student";
                } else if (data.usertype === "lecturer") {
                    window.location.href = "https://bruhif.github.io/dashboard/lecturer";
                } else if (data.usertype === "community") {
                    window.location.href = "https://bruhif.github.io/dashboard/community";
                }
            } else {
                alert(data.message);
            }
        })
        .catch(error => {
            console.error("Error:", error);
        });
    });
</script>
