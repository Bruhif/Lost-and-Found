<body>

<h2>Lecturer Registration Form</h2>

<form id="registerForm">
    <input type="text" id="name" placeholder="Username">
    <br><br>
    <input type="email" id="email" placeholder="Email">
    <br><br>
    <input type="password" id="password" placeholder="Password">
    <br><br>
    <input type="text" id="phone" placeholder="Phone Number">
    <br><br>
    <select name="department" id="department">
        <option value="">Select Department</option>
        <option value="Computer Science">Information Technology</option>
        <option value="Mathematics">Accounting</option>
        <option value="Physics">Management</option>
        <option value="Chemistry">Psychology</option>
    </select>
    <br><br>
    <button type="submit">Submit</button>
</form>

<script>
    document.getElementById("registerForm").addEventListener("submit", function(event) {
        event.preventDefault();
        
        const userData = {
            username: document.getElementById("name").value,
            email: document.getElementById("email").value,
            password: document.getElementById("password").value,
            phone_number: document.getElementById("phone").value,
            department: document.getElementById("department").value,
            usertype: "lecturer"
        };

        fetch("https://legion-is-here.tail208289.ts.net/add/lecturer", {
            method: "POST",
            headers: {
                "Content-Type": "application/json"
            },
            body: JSON.stringify(userData)
        })
        .then(response => response.json())
        .then(data => {
            alert(data.message);
        })
        .catch(error => {
            console.error("Error:", error);
        });
    });
</script>
