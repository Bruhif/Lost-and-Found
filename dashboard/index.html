<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Lost & Found Dashboard</title>

</head>

<body>

    <header>
        <h1>Lost & Found</h1>

        <div class="user-info">
            <span id="username">Loading...</span>
            <button id="logoutButton">Logout</button>
        </div>
    </header>


    <main>

        <section class="dashboard-header">
            <h2>Items</h2>

            <button id="reportButton">
                Report Item
            </button>
        </section>


        <section class="filters">

            <button class="filter active" data-status="all">
                All
            </button>

            <button class="filter" data-status="Lost">
                Lost
            </button>

            <button class="filter" data-status="Found">
                Found
            </button>

            <select id="categoryFilter">
                <option value="all">All Categories</option>
                <option value="Electronics">Electronics</option>
                <option value="Food & Drinks">Food & Drinks</option>
                <option value="Documents">Documents</option>
                <option value="Clothing">Clothing</option>
                <option value="Accessories">Accessories</option>
                <option value="Bags">Bags</option>
                <option value="Keys">Keys</option>
                <option value="Stationery">Stationery</option>
                <option value="Others">Others</option>
            </select>

        </section>


        <section id="itemList" class="item-list">

            <!-- JavaScript will put items here -->

        </section>

    </main>


    <script src="scripts.js"></script>

</body>
</html>
