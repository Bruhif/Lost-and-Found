<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>Admin Panel</title>
<link rel="stylesheet" href="../style.css">
<link rel="stylesheet" href="../dashboard/dashboard.css">
<link rel="stylesheet" href="style.css">
</head>
<body class="dashboard-body">

<h1>Admin Panel</h1>

<nav class="tabs">
    <button class="tab-btn active" data-tab="pendingClaims">Pending Claims</button>
    <button class="tab-btn" data-tab="allItems">All Reports</button>
</nav>

<section id="pendingClaims" class="tab-section active">
    <h2>Claims Awaiting Verification</h2>
    <div id="claimQueue" class="item-grid"></div>
</section>

<section id="allItems" class="tab-section">
    <h2>All Reported Items</h2>
    <div id="adminItemList" class="item-grid"></div>
</section>

<div id="imageLightbox" class="lightbox hidden">
    <img id="lightboxImage" src="" alt="Enlarged view">
</div>

<script src="scripts.js" defer></script>
</body>
</html>
